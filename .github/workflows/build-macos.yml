name: Build macOS (CI)

# Valida que o Nokotuber COMPILA para macOS (Apple Silicon + Intel) sem precisar
# de um Mac. Gera os bundles como GitHub Actions Artifacts para teste privado.
# NÃO cria/publica Release e NÃO anexa a nenhuma release. Não assina/notariza.

on:
  workflow_dispatch: {}          # execução manual
  pull_request:                  # valida o build em PRs
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read                 # só leitura; NÃO precisamos de write (sem release)

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin   # M1/M2/M3/M4…
            runner: macos-14                # runner Apple Silicon (build nativo)
            label: apple-silicon
          - target: x86_64-apple-darwin     # Macs Intel
            runner: macos-14                # cross-compile no Apple Silicon: os
                                            # runners macos-13 (Intel) são escassos
                                            # e estão em descontinuação; o SDK do
                                            # macOS é universal, então o alvo x86_64
                                            # compila sem um Mac Intel real.
            label: intel
    runs-on: ${{ matrix.runner }}

    # URL pública da Store API e origens extras da CSP. NÃO são segredos (URL
    # pública não é credencial), mas variam por ambiente e este repositório é
    # PÚBLICO — então vêm das Variables do Actions, não escritas aqui.
    #
    # NOKOTUBER_REQUIRE_STORE_API_URL=1 faz o build FALHAR se a variable não
    # estiver definida, em vez de gerar silenciosamente um instalador apontando
    # para http://localhost:8080 (foi o que aconteceu com os pacotes de macOS).
    # Configure em: Settings > Secrets and variables > Actions > Variables.
    env:
      VITE_STORE_API_URL: ${{ vars.VITE_STORE_API_URL }}
      NOKOTUBER_CSP_EXTRA_ORIGINS: ${{ vars.NOKOTUBER_CSP_EXTRA_ORIGINS }}
      NOKOTUBER_REQUIRE_STORE_API_URL: "1"


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Setup Rust (+ target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Read app version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Só as dependências do DESKTOP. O store-backend é standalone e NÃO faz parte
      # deste workspace, então não é instalado nem iniciado aqui (sem Postgres,
      # sem Mercado Pago, sem .env). O cliente da Loja compila com fallback padrão.
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # tauri build roda o beforeBuildCommand (pnpm build) e compila o Rust.
      # Gera a CSP deste build a partir de VITE_STORE_API_URL. Sem isto o
      # instalador sai com a CSP padrão (só localhost) e a Loja é bloqueada no
      # aplicativo empacotado — erro que NÃO aparece em `tauri dev`.
      # Falha aqui, cedo e com mensagem, se a variable não estiver configurada.
      - name: Gerar CSP do build
        run: pnpm csp:config

      - name: Build Tauri app (${{ matrix.target }})
        run: pnpm exec tauri build --config src-tauri/tauri.conf.csp.json --target ${{ matrix.target }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: Nokotuber-v${{ steps.ver.outputs.version }}-macos-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
