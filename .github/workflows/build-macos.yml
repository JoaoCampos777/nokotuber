name: Build macOS and upload to existing release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, exemplo: v0.1.0"
        required: true
        type: string

jobs:
  build-macos:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-apple-darwin,x86_64-apple-darwin"

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install

      - name: Build macOS universal app
        run: pnpm tauri build -- --target universal-apple-darwin

      - name: Upload macOS files to existing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber
          gh release upload "$TAG" src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz --clobber || true
