[package]
name = "pngtuber-studio"
version = "0.4.0"
description = "Nokotuber — ferramenta de PNGTuber para streamers"
authors = ["Nokotuber"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pngtuber_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pngtuber-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
ureq = "2"
tungstenite = "0.21"


[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
